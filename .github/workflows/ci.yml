name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: determinism (same inputs, same per-tick hash, twice)
        run: npm run test:determinism
      - name: budget (five fighters + one cut under 3 ms)
        run: npm run test:budget
      - name: phone bench page builds (one self-contained html, no external requests)
        run: |
          npm run build:bench
          test -s proof/bench/dist/bench.html
          ! grep -E "(src|href)=[\"']https?:" proof/bench/dist/bench.html
      - name: state runners, bodies, target pose
        run: node --test test/states.test.mjs test/bodies.test.mjs test/pose.test.mjs test/three-rig.test.mjs test/api2.test.mjs test/hinge.test.mjs test/cut.test.mjs test/cutbones.test.mjs test/vteam.test.mjs test/cut-validate.test.mjs
      - name: rules (M4 rows validate, bad probes rejected, round-trip hash)
        run: node --test test/rules.test.mjs
      - name: rules evaluator (every outcome, armour never blocks, counters, determinism)
        run: node --test test/rules-eval.test.mjs
      - name: cut-units (synthetic skinned body, hair whole to the head, cap winding on a self-crossing loop, opt-in head_split and belly_open, real V3 bodies only where their GLBs exist)
        run: node --test test/cut-units.test.mjs
      - name: cut-batch (two synthetic bodies through measure, cut, validate and the receipt; row checks; blocked rows; props and a second UV set in the source)
        run: node --test test/cut-batch.test.mjs
      - name: cut-validate (plane_exempt hair, native versus introduced open and flipped edges, --self; the head_split and belly_open checks run in the cut-units step)
        run: node --test test/cut-validate.test.mjs
