name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: determinism (same inputs, same per-tick hash, twice)
        run: npm run test:determinism
      - name: budget (five fighters + one cut under 3 ms)
        run: npm run test:budget
      - name: state runners, bodies, target pose
        run: node --test test/states.test.mjs test/bodies.test.mjs test/pose.test.mjs
